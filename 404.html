<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b0d">
    <title>404 | Ilan Lenzner</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
    <link rel="stylesheet" href="/fonts/fonts.css?v=1">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0b0b0d; --bg-card: #131318;
            --ink: #f2f2f4; --ink-muted: #9d9da8; --ink-dim: #6b6b76;
            --line: rgba(255,255,255,0.09); --line-strong: rgba(255,255,255,0.18);
            --accent: #8a7bff; --accent-ink: #a99dff;
            --serif: 'Instrument Serif', Georgia, serif;
            --mono: 'JetBrains Mono', ui-monospace, monospace;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg); color: var(--ink);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            -webkit-font-smoothing: antialiased;
            background-image: radial-gradient(ellipse 800px 500px at 50% -10%, rgba(138,123,255,0.07), transparent 60%);
        }
        .wrap { padding: 32px; max-width: 560px; }
        .label {
            font-family: var(--mono);
            font-size: 11.5px; font-weight: 600;
            letter-spacing: 0.14em; text-transform: uppercase;
            color: var(--accent-ink);
            margin-bottom: 18px;
        }
        h1 {
            font-family: var(--serif);
            font-weight: 400;
            font-size: clamp(38px, 7vw, 56px);
            line-height: 1.08;
            letter-spacing: -0.01em;
            margin-bottom: 18px;
        }
        h1 em { font-style: italic; color: var(--accent-ink); }
        p {
            font-size: 15.5px; color: var(--ink-muted);
            line-height: 1.75; margin-bottom: 32px;
        }
        .actions { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 11px 22px; border-radius: 999px;
            font-size: 13.5px; font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s, background 0.2s, border-color 0.2s;
        }
        .btn-primary { background: var(--ink); color: #111; }
        .btn-primary:hover { background: #fff; transform: translateY(-1px); }
        .btn-outline { border: 1px solid var(--line-strong); color: var(--ink); }
        .btn-outline:hover { border-color: var(--ink-dim); transform: translateY(-1px); }
        .meta {
            margin-top: 40px;
            font-family: var(--mono); font-size: 11px;
            color: var(--ink-dim); letter-spacing: 0.04em;
            margin-bottom: 0;
        }
        ::selection { background: var(--accent); color: #0b0b0d; }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="label">404 · Page not found</p>
        <h1>Nothing ships from <em>this</em> URL.</h1>
        <p>The page you're after moved, was renamed, or never existed. The work, though - that's all still here.</p>
        <div class="actions">
            <a href="/" class="btn btn-primary">Back home</a>
            <a href="/#work" class="btn btn-outline">See the work</a>
        </div>
        <p class="meta">ilans.net · designed in Figma, shipped in code</p>
    </div>
</body>
</html>
